<?xml version="1.0" encoding="UTF-8"?>
<!-- Dotlore. A dot, and the two halves of a sync ring around it. Monochrome
     on purpose: the only thing this has to survive is being squeezed to 16 px
     by sips. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" rx="228" fill="#1c1c1e"/>
  <g fill="none" stroke="#f5f5f7" stroke-width="64" stroke-linecap="round">
    <path d="M 607.8 248.9 A 280 280 0 0 1 607.8 775.1"/>
    <path d="M 416.2 775.1 A 280 280 0 0 1 416.2 248.9"/>
  </g>
  <circle cx="512" cy="512" r="112" fill="#f5f5f7"/>
</svg>
