[package]
name = "dotlore"
version = "0.2.1"
edition = "2021"

[workspace]

[[bin]]
name = "dotlore"
path = "src/main.rs"

[dependencies]
anyhow = "1"
ignore = "0.4"
notify = "8"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The About panel's credits are a plain string in Tauri, so they sit left.
# AppKit centers them only when the attributed string's paragraph style says so.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.1"
objc2-app-kit = { version = "0.3.0", default-features = false, features = [
    "std",
    "NSApplication",
    "NSAttributedString",
    "NSFont",
    "NSImage",
    "NSParagraphStyle",
    "NSText",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.0", default-features = false, features = [
    "std",
    "NSAttributedString",
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSRange",
    "NSString",
    "NSURL",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
