[package]
name = "dotlore-app"
version.workspace = true
edition = "2021"

[[bin]]
name = "dotlore-app"
path = "src/main.rs"

[dependencies]
dotlore-core = { path = "../dotlore-core" }
anyhow = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2" }

[dev-dependencies]
tempfile = "3"
