name: Deploy website

# The release commit rewrites the version badge in website/index.html, so a push
# alone would put the new version on the site ~10-35 minutes before release.yml
# publishes it. Every trigger therefore goes through the "badge is released" gate
# below, and a successful Release run deploys the site once the version is live.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deploy only when the badge names the latest published release. A badge
      # ahead of it means release.yml has not published yet; that run's
      # workflow_run trigger deploys the site when it succeeds.
      - name: Hold the site until its badge version is released
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          badge=$(sed -n '/<!-- dotlore:version -->/,/<!-- \/dotlore:version -->/p' website/index.html \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
          latest=$(gh release view --json tagName -q .tagName 2>/dev/null || echo none)
          echo "Badge: ${badge:-missing}  Latest release: $latest"
          if [ -n "$badge" ] && [ "$badge" = "$latest" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Badge $badge is not the latest published release ($latest) — skipping; the Release run deploys the site when it publishes."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - if: steps.gate.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
