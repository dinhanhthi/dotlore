name: Release

# Publishes a signed + notarized universal macOS build.
#
# Trigger: pushing a `v*` tag. Dotlore ships STABLE ONLY — there is no -rc/-beta
# channel and no prerelease mechanism. Every release is served to every install
# through /releases/latest/download/latest.json, which is why `--prerelease` is
# never passed and the release must not stay a draft: GitHub's "latest" serves
# neither.
#
# The build runs `scripts/build.sh` — the same script that builds Dotlore on a
# developer's Mac. One build path is the point: the local dry run in the release
# runbook genuinely predicts this job rather than merely rehearsing it.
#
# Third-party actions are pinned to commit SHAs. This one job holds every signing
# secret at once — most importantly the minisign updater key, which can never be
# rotated after the first release (see .github/release-setup.md) — so a moved
# mutable tag upstream would be enough to exfiltrate it.
#
# Required secrets are documented in .github/release-setup.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      # workflow_dispatch can be fired from a branch, where github.ref_name is
      # the branch name. Without this guard that produces a real, non-prerelease
      # release tagged "main" whose latest.json declares version "main" — served
      # straight to every client from /releases/latest. Manual runs stay allowed,
      # but only from a v* tag ref.
      - name: Require a v* tag ref
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) echo "Releasing from $GITHUB_REF" ;;
            *)
              echo "::error::This workflow only runs from a v* tag ref (got $GITHUB_REF). Push a tag, or re-dispatch selecting a tag rather than a branch."
              exit 1
              ;;
          esac

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The job never pushes; leaving a write-scoped token in .git/config
          # only widens what a compromised later step could reach.
          persist-credentials: false

      # The pnpm version comes from package.json's `packageManager` field, so
      # this action needs no `version` input.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # v7, not v4: v4 runs on Node 20, which GitHub deprecated — runners force
      # it onto Node 24 and warn on every run. v7 targets Node 24 natively and
      # still accepts the `cache` input used below.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # Both Apple targets, or scripts/build.sh warns about the missing one and
      # CONTINUES, publishing a single-arch bundle. That is a silent failure:
      # the release looks complete and half the Macs that install it get an
      # emulated or unrunnable binary. The lipo assertion below is the backstop.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # Install before any signing material is written to disk, so no lifecycle
      # script can run while the certificate and notarization key sit
      # unencrypted in $RUNNER_TEMP.
      - run: pnpm install --frozen-lockfile

      # The tag is the only input a human types by hand here, and a mismatch is
      # invisible until users fail to receive an update: latest.json would
      # advertise the tag's version while the shipped binary reports the
      # manifest's, so clients already on the manifest version see nothing to
      # update to.
      #
      # src-tauri/Cargo.toml [package] version is the single source of truth.
      # src-tauri/tauri.conf.json deliberately has NO `version` key — the
      # bundler resolves it from the manifest — and the root package.json has no
      # `version` field either. Do not add one to create a second source.
      - name: Check the tag matches src-tauri/Cargo.toml
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(python3 -c 'import tomllib;print(tomllib.load(open("src-tauri/Cargo.toml","rb"))["package"]["version"])')"
          echo "tag=$VERSION  src-tauri/Cargo.toml=$CARGO_VERSION"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src-tauri/Cargo.toml version $CARGO_VERSION. Bump the version files (/cf-ship does this) before tagging."
            exit 1
          fi

      # A build missing any of these still succeeds and still launches — it just
      # ships an unnotarized bundle Gatekeeper blocks, or unsigned updater
      # artifacts no client will accept. Both are discovered by users rather
      # than by CI, so fail loudly instead. Only names and pass/fail are
      # printed, never values.
      - name: Assert required secrets are present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD \
            APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8 \
            TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            else
              echo "ok: $name"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # Import the Developer ID certificate into a throwaway keychain, then read
      # the signing identity back out of it. Resolving the identity from the
      # imported certificate (rather than taking it as a separate secret) means
      # it can never drift from the certificate actually being used — which is
      # why APPLE_SIGNING_IDENTITY is deliberately NOT a repository secret.
      #
      # Grep for "Developer ID Application" specifically. The Tauri docs example
      # greps "Apple Development", which is a development certificate and cannot
      # be distributed.
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # Remove the decoded .p12 even if an import step below fails.
          trap 'rm -f "$CERT_PATH"' EXIT

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity in the imported certificate. An 'Apple Development' certificate cannot be distributed."
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "Resolved signing identity: $IDENTITY"
          # Heredoc form, not NAME=value: a value carrying a newline would
          # otherwise inject further assignments into every later step. The
          # certificate is the maintainer's own, so this is defence in depth.
          {
            echo "APPLE_SIGNING_IDENTITY<<IDENTITY_EOF"
            echo "$IDENTITY"
            echo "IDENTITY_EOF"
          } >> "$GITHUB_ENV"

      # The App Store Connect key is stored as base64 file *contents*; the
      # APPLE_API_KEY_PATH that Tauri reads is a path this step creates.
      - name: Stage App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Release notes come from CHANGELOG.md, which is also what the guide
      # writes per release. Tolerant by design: the workflow must still run if
      # the section is missing.
      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BODY=""
          if [ -f CHANGELOG.md ]; then
            # Matched with literal string comparison, not a regex. Escaping the
            # version for a regex does not work here: awk processes backslash
            # escapes in -v assignments, so a pre-escaped "1\.0\.0" arrives back
            # as "1.0.0" and the dots are wildcards again — which makes
            # "## v1a0a0" match 1.0.0.
            BODY="$(awk -v v="$VERSION" '
              function is_version_heading(line, ver,   rest, nxt) {
                if (substr(line, 1, 3) != "## ") return 0
                rest = substr(line, 4)
                if (substr(rest, 1, 1) == "v") rest = substr(rest, 2)
                if (substr(rest, 1, length(ver)) != ver) return 0
                nxt = substr(rest, length(ver) + 1, 1)
                return (nxt == "" || nxt == " " || nxt == "(")
              }
              is_version_heading($0, v) { found = 1; next }
              found && substr($0, 1, 3) == "## " { exit }
              found { print }
            ' CHANGELOG.md)"
          fi
          if [ -z "$(printf '%s' "$BODY" | tr -d '[:space:]')" ]; then
            BODY="See the commit history for changes in ${GITHUB_REF_NAME}."
            echo "No CHANGELOG.md section for $VERSION — using a placeholder body."
          fi
          # A file, not a step output: the body is arbitrary Markdown and
          # gh reads it with --notes-file.
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"

      # The same script a developer runs locally. TAURI_SIGNING_PRIVATE_KEY is
      # scoped to this step only, and scripts/ui-build.sh scrubs it before the
      # frontend build so no vite plugin or JS dependency can read the private
      # half of the update trust anchor out of process.env. That key cannot be
      # rotated once a release ships, so a leak is not recoverable by re-signing.
      #
      # APPLE_SIGNING_IDENTITY and APPLE_API_KEY_PATH arrive from $GITHUB_ENV.
      # APPLE_CERTIFICATE is deliberately NOT passed: the certificate is already
      # in the keychain search list, and passing it would make the bundler run a
      # second, redundant keychain setup of its own.
      - name: Build (signed + notarized universal)
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/build.sh

      # The bundler emits Dotlore.app.tar.gz and its .sig but NOT the manifest
      # the updater reads. Build it here, then assert it — this is the single
      # place this pipeline can silently break every client: a green run, a
      # perfect-looking release, and every install refusing the update, possibly
      # for months. Failing the job here is the whole mitigation, and it runs
      # before the release is ever created.
      - name: Generate latest.json and assert the artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          APP="$BUNDLE/macos/Dotlore.app"
          TARBALL="$APP.tar.gz"
          SIG="$TARBALL.sig"

          for f in "$TARBALL" "$SIG"; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing or empty updater artifact: $f — is bundle.createUpdaterArtifacts still true in src-tauri/tauri.conf.json?"
              exit 1
            fi
          done

          # Universal or nothing. scripts/build.sh only warns when a target is
          # missing, so this is where a single-arch bundle is caught.
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/dotlore")"
          echo "lipo -archs: $ARCHS"
          case "$ARCHS" in
            *x86_64*) ;;
            *) echo "::error::Not a universal binary (archs: $ARCHS) — the x86_64 slice is missing."; exit 1 ;;
          esac
          case "$ARCHS" in
            *arm64*) ;;
            *) echo "::error::Not a universal binary (archs: $ARCHS) — the arm64 slice is missing."; exit 1 ;;
          esac

          # The version comes from the TAG only, never from a file: the
          # tag-vs-manifest check above is the single place the two are allowed
          # to disagree, and it already failed the job if they did.
          python3 - "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$SIG" > "$RUNNER_TEMP/latest.json" <<'PY'
          import datetime, json, sys

          version, tag, repo, sig_path = sys.argv[1:5]
          signature = open(sig_path).read().strip()
          url = f"https://github.com/{repo}/releases/download/{tag}/Dotlore.app.tar.gz"

          # The updater looks up "{target}-{arch}", so BOTH darwin keys must be
          # present even though one universal tarball serves them. darwin-universal
          # is harmless and is what newer clients prefer.
          entry = {"signature": signature, "url": url}
          print(json.dumps({
              "version": version,
              "pub_date": datetime.datetime.now(datetime.timezone.utc)
                  .replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "platforms": {
                  "darwin-aarch64": entry,
                  "darwin-x86_64": entry,
                  "darwin-universal": entry,
              },
          }, indent=2))
          PY

          python3 - "$RUNNER_TEMP/latest.json" "$VERSION" <<'PY'
          import base64, json, sys

          manifest = json.load(open(sys.argv[1]))
          expected = sys.argv[2]
          if manifest["version"] != expected:
              sys.exit(f"::error::latest.json version {manifest['version']!r} != tag version {expected!r}")
          for key in ("darwin-aarch64", "darwin-x86_64"):
              platform = manifest["platforms"].get(key)
              if not platform:
                  sys.exit(f"::error::latest.json has no {key} entry — the updater would never resolve an update for it.")
              signature = platform.get("signature", "").strip()
              if not signature:
                  sys.exit(f"::error::latest.json {key} has an empty signature — every client would silently refuse the update.")
              # The client base64-decodes this string and parses the result as a
              # minisign signature file. Putting the raw file in instead of its
              # base64 is the shape mistake that still LOOKS like a signature in
              # the manifest, and it fails on every client, not in CI.
              try:
                  decoded = base64.b64decode(signature, validate=True).decode()
              except Exception as e:
                  sys.exit(f"::error::latest.json {key} signature is not valid base64 ({e}) — it must be the .sig file's contents verbatim.")
              if not decoded.lstrip().startswith("untrusted comment:"):
                  sys.exit(f"::error::latest.json {key} signature does not decode to a minisign signature file.")
              if not platform.get("url", "").startswith("https://"):
                  sys.exit(f"::error::latest.json {key} has no https url.")

          # Informational, never fatal. plugins.updater.requireSignedVersion is
          # left unset (defaults false) until this line proves the bundler stamps
          # a version into the signature's trusted comment on this toolchain.
          # Turning it on without that would strand every install, exactly the way
          # a wrong pubkey would. Read this in the first release's log, then decide.
          trusted = base64.b64decode(
              manifest["platforms"]["darwin-aarch64"]["signature"]).decode()
          stamped = [ln for ln in trusted.splitlines() if ln.startswith("trusted comment:")]
          print(f"trusted comment: {stamped[0] if stamped else '(none)'}")
          print("requireSignedVersion is safe to enable"
                if stamped and "version:" in stamped[0]
                else "requireSignedVersion must stay off — no version: in the trusted comment")

          print("latest.json asserted: both darwin keys present, signatures decode as minisign.")
          PY

          cat "$RUNNER_TEMP/latest.json"

      # Draft first, upload, publish last. The release is therefore never
      # visible half-uploaded — strictly better than incremental uploads, where
      # latest.json can land before the tarball it points at and clients chase a
      # 404. It must not STAY a draft: /releases/latest serves neither drafts nor
      # prereleases, so either would strand every install on the old version.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          # Named, not inferred. gh would otherwise resolve the repo from the
          # origin remote that actions/checkout configured — which works, but
          # this job publishes the release and the inference is free to remove.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          APP="$BUNDLE/macos/Dotlore.app"

          # Discovered, never hardcoded: the bundler's .dmg filename embeds the
          # version and the arch and is not ours to predict. Rooted at the
          # universal tree specifically, because scripts/build.sh also mirrors
          # the whole bundle into target/release/bundle.
          DMG="$(find "$BUNDLE" -name '*.dmg' -type f | head -n 1)"
          if [ -z "$DMG" ]; then
            echo "::error::No .dmg under $BUNDLE — is \"dmg\" still in bundle.targets in src-tauri/tauri.conf.json?"
            exit 1
          fi
          echo "Found dmg: $DMG"

          # The version-less alias the website's Download button links. A
          # versioned URL in the release commit would 404 for the ~30 minutes
          # until this job publishes; the alias keeps resolving to the previous
          # release until the moment this one goes live.
          ALIAS="$RUNNER_TEMP/Dotlore-universal.dmg"
          cp "$DMG" "$ALIAS"

          # A run that failed between `create` and `--draft=false` leaves a draft
          # behind, and `gh release create` then dies with 422 already_exists —
          # at exactly the moment the runbook promises `gh run rerun <run-id>`
          # just works, with an error that reads like a different failure. Clear
          # a leftover DRAFT so the rerun is genuinely one command.
          #
          # A PUBLISHED release is never touched: clients may already have
          # fetched its latest.json, so it is fixed forward as the next patch.
          # The tag is never deleted either — `gh release delete` leaves it
          # alone without --cleanup-tag, and that omission is deliberate.
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null || echo none)" = "true" ]; then
            echo "Deleting a leftover draft release from a previous run."
            gh release delete "$GITHUB_REF_NAME" --yes
          fi

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Dotlore v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

          gh release upload "$GITHUB_REF_NAME" \
            "$DMG" \
            "$ALIAS" \
            "$APP.tar.gz" \
            "$APP.tar.gz.sig" \
            "$RUNNER_TEMP/latest.json"

          gh release edit "$GITHUB_REF_NAME" --draft=false
          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,assets

      - name: Clean up signing assets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" 2>/dev/null || true
          fi
